function extractPuterReplyText(response){
  if(!response) return "";
  if(typeof response === "string") return response.trim();
  if(response.message && typeof response.message.content === "string") return response.message.content.trim();
  if(response.message && Array.isArray(response.message.content)){
    return response.message.content.filter(b=>b && b.type==="text").map(b=>b.text).join("\n").trim();
  }
  if(typeof response.text === "string") return response.text.trim();
  if(response.toString && response.toString() !== "[object Object]") return response.toString().trim();
  return "";
}

async function sendAssistantMessage(text){
  text = (text||"").trim();
  if(!text || chatThinking) return;
  chatThinking = true;
  setJarvisState("thinking");
  setCaption("");

  const systemPrompt = "You are Jarvis, the ops assistant for SS Intelligence, a demolition and moving services company (interior/exterior demolition, junk removal, moving, equipment transport, packing, commercial and residential cleanup, landscaping, flooring/kitchen/bathroom demolition, concrete demolition, and Blue Seal certified jobs). "
    + "You are speaking directly to the owners/management. Be concise, direct, and practical - like a sharp operations manager, not a customer service bot. Keep answers short and speakable out loud - a few sentences, not a report. "
    + "Use the business data below to answer accurately. If asked to draft a message, write it ready to send. If data is missing for a question, say so plainly rather than guessing.\n\n"
    + buildBusinessContext();

  try{
    // Puter.js is the only AI path now — genuinely keyless, no setup for the crew.
    // Give it up to 3 tries in case the SDK is still finishing its own init/sign-in handshake.
    let puterReady = (typeof puter !== "undefined" && puter.ai && typeof puter.ai.chat === "function");
    for(let i=0; i<3 && !puterReady; i++){
      await new Promise(r=>setTimeout(r, 700));
      puterReady = (typeof puter !== "undefined" && puter.ai && typeof puter.ai.chat === "function");
    }
    if(!puterReady){
      throw new Error(
        typeof puter === "undefined"
          ? "PUTER_NOT_LOADED" // the js.puter.com script never reached the page
          : "PUTER_NOT_READY"  // script loaded but puter.ai isn't there yet
      );
    }

    const fullPrompt = systemPrompt + "\n\nUser question: " + text;
    const response = await puter.ai.chat(fullPrompt, { model: "claude-sonnet-4" });
    const reply = extractPuterReplyText(response) || "I didn't get a usable response - try rephrasing that.";
    setCaption(reply);
    speak(reply); // sets jarvisState to speaking, then idle on end
  }catch(e){
    console.error("Assistant error", e);
    let hint;
    if(e && e.message === "PUTER_NOT_LOADED"){
      hint = "Jarvis's AI engine (Puter.js) never loaded. Check your internet connection, or that nothing (an ad-blocker, firewall, or offline network settings) is blocking js.puter.com, then refresh the page.";
    } else if(e && e.message === "PUTER_NOT_READY"){
      hint = "Jarvis's AI engine is still starting up. Wait a few seconds and try again.";
    } else if(e && /pop.?up/i.test(e.message||"")){
      hint = "Puter needs a quick one-time sign-in popup - your browser may have blocked it. Allow popups for this page and try again.";
    } else {
      hint = "Jarvis couldn't get a response" + (e && e.message ? (": " + e.message) : "") + ". Try again in a moment.";
    }
    setCaption(hint);
    setJarvisState("idle");
  }
  chatThinking = false;
}

function setCaption(text){
  const el = document.getElementById('coreCaption');
  if(!el) return;
  clearTimeout(captionClearTimer);
  el.textContent = text;
  el.classList.toggle('show', !!text);
  if(text){
    captionClearTimer = setTimeout(()=>{ el.classList.remove('show'); }, 9000);
  }
}

function initAssistantView(){
  updateVoiceToggleUI();
  updateMicUI();
  updateSpeakingIndicator();
  initCoreVisual();
  const micBtn = document.getElementById('micBtn');
  const voiceBtn = document.getElementById('voiceToggleBtn');
  if(!SpeechRecognitionAPI && micBtn) micBtn.classList.add('mic-unsupported');
  if(micBtn) micBtn.addEventListener('click', ()=>{
    if(isListening) stopListening(); else { setCaption(""); startListening(); }
  });
  if(voiceBtn) voiceBtn.addEventListener('click', ()=>{
    voiceOutputEnabled = !voiceOutputEnabled;
    updateVoiceToggleUI();
    if(!voiceOutputEnabled && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    showToast(voiceOutputEnabled ? "Spoken replies on" : "Spoken replies off");
  });
}
