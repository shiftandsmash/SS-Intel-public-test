<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SS Intelligence — Ops HUD</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://js.puter.com/v2/"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');

:root{
  --bg:#040A0F;
  --bg-2:#061119;
  --panel:rgba(8,22,32,0.78);
  --panel-solid:#0A1720;
  --grid:rgba(56,196,235,0.05);
  --cyan:#4FE3FF;
  --cyan-soft:#8FEEFF;
  --cyan-dim:#1C7C93;
  --cyan-glow:rgba(79,227,255,0.35);
  --blue:#3B82F6;
  --amber:#FFB020;
  --danger:#FF4D5E;
  --success:#39F0B0;
  --text:#DFF8FF;
  --muted:#6F94A6;
  --muted-2:#456273;
  --border:#134353;
  --radius:2px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:
    radial-gradient(ellipse at 50% -10%, rgba(30,90,120,0.25), transparent 55%),
    radial-gradient(ellipse at 100% 100%, rgba(20,70,100,0.15), transparent 50%),
    var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  font-weight:500;
  min-height:100vh;
  position:relative;
}
body::before{
  content:"";
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:34px 34px;
  mask-image:radial-gradient(ellipse at 50% 30%, black 0%, transparent 75%);
  opacity:0.6;
}
.hud{font-family:'Orbitron',sans-serif;text-transform:uppercase;letter-spacing:0.08em;}
.mono{font-family:'Share Tech Mono',monospace;}
::-webkit-scrollbar{width:7px;height:7px;}
::-webkit-scrollbar-thumb{background:var(--cyan-dim);border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

@keyframes pulse-glow{0%,100%{opacity:1;}50%{opacity:0.55;}}
@keyframes spin-slow{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes spin-rev{from{transform:rotate(360deg);}to{transform:rotate(0deg);}}

.stat-card,.ticket,.table-wrap,.modal,.reactor-panel{
  position:relative;
  background:var(--panel);
  border:1px solid var(--border);
  background-image:
    linear-gradient(var(--cyan) 0 0) top left/11px 1.5px no-repeat,
    linear-gradient(var(--cyan) 0 0) top left/1.5px 11px no-repeat,
    linear-gradient(var(--cyan) 0 0) top right/11px 1.5px no-repeat,
    linear-gradient(var(--cyan) 0 0) top right/1.5px 11px no-repeat,
    linear-gradient(var(--cyan) 0 0) bottom left/11px 1.5px no-repeat,
    linear-gradient(var(--cyan) 0 0) bottom left/1.5px 11px no-repeat,
    linear-gradient(var(--cyan) 0 0) bottom right/11px 1.5px no-repeat,
    linear-gradient(var(--cyan) 0 0) bottom right/1.5px 11px no-repeat;
  background-repeat:no-repeat;
}

#app{display:flex;min-height:100vh;position:relative;z-index:1;}

.sidebar{
  width:224px;flex-shrink:0;
  background:linear-gradient(180deg, var(--bg-2), var(--bg));
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:relative;
  box-shadow:inset -1px 0 12px rgba(79,227,255,0.04);
}
.brand{padding:26px 20px 20px 22px;border-bottom:1px solid var(--border);position:relative;}
.brand-ring{
  width:46px;height:46px;border-radius:50%;
  border:1.5px solid var(--cyan-dim);position:relative;margin-bottom:12px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 14px var(--cyan-glow), inset 0 0 10px rgba(79,227,255,0.15);
}
.brand-ring::before{
  content:"";position:absolute;inset:-6px;border-radius:50%;
  border:1px dashed var(--cyan-dim);opacity:0.5;animation:spin-slow 14s linear infinite;
}
.brand-ring .dot{width:16px;height:16px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px 3px var(--cyan-glow);animation:pulse-glow 2.4s ease-in-out infinite;}
.brand-name{font-family:'Orbitron';font-weight:700;font-size:16.5px;letter-spacing:0.05em;line-height:1.3;color:var(--text);text-shadow:0 0 12px var(--cyan-glow);}
.brand-name span{color:var(--cyan);}
.brand-sub{font-family:'Share Tech Mono';font-size:10px;color:var(--cyan-dim);letter-spacing:0.15em;text-transform:uppercase;margin-top:5px;}

.nav{padding:18px 12px;display:flex;flex-direction:column;gap:3px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius);
  color:var(--muted);font-size:13px;font-weight:600;letter-spacing:0.03em;
  cursor:pointer;border:1px solid transparent;transition:background .12s,color .12s,border-color .12s;user-select:none;
}
.nav-item svg{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.7;}
.nav-item:hover{background:rgba(79,227,255,0.06);color:var(--cyan-soft);}
.nav-item.active{background:rgba(79,227,255,0.09);color:var(--cyan);border-color:var(--cyan-dim);box-shadow:0 0 14px rgba(79,227,255,0.08) inset;}
.nav-item.active svg{filter:drop-shadow(0 0 4px var(--cyan-glow));}
.nav-count{margin-left:auto;font-family:'Share Tech Mono';font-size:10px;background:rgba(255,255,255,0.05);color:var(--muted);padding:1px 6px;border-radius:10px;border:1px solid var(--border);}
.nav-item.active .nav-count{background:var(--cyan);color:#00232B;border-color:var(--cyan);}
.sidebar-foot{padding:14px 20px;border-top:1px solid var(--border);font-family:'Share Tech Mono';font-size:9.5px;color:var(--muted-2);letter-spacing:0.08em;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:66px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;border-bottom:1px solid var(--border);background:rgba(6,17,25,0.7);backdrop-filter:blur(6px);
}
.topbar h1{font-family:'Orbitron';font-size:16px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text);text-shadow:0 0 10px var(--cyan-glow);}
.topbar-actions{display:flex;gap:10px;align-items:center;}
.datebadge{font-family:'Share Tech Mono';font-size:12px;color:var(--cyan-dim);letter-spacing:0.04em;}

.content{flex:1;overflow-y:auto;padding:26px 28px 40px;}
.view{display:none;}
.view.active{display:block;animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.btn{
  font-family:'Rajdhani';font-weight:700;font-size:13px;letter-spacing:0.03em;
  padding:9px 16px;border-radius:var(--radius);border:1px solid var(--border);
  background:rgba(79,227,255,0.04);color:var(--text);cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:filter .12s,transform .05s,box-shadow .12s;
  text-transform:uppercase;
}
.btn:hover{filter:brightness(1.2);box-shadow:0 0 12px rgba(79,227,255,0.12);}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--cyan);border-color:var(--cyan);color:#00232B;box-shadow:0 0 16px var(--cyan-glow);}
.btn-ghost{background:transparent;}
.btn-danger{background:rgba(255,77,94,0.08);border-color:rgba(255,77,94,0.4);color:#FF9AA4;}
.btn-sm{padding:6px 11px;font-size:11.5px;}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}

.reactor-panel{padding:22px 26px;margin-bottom:24px;display:flex;align-items:center;gap:28px;flex-wrap:wrap;}
.reactor{width:104px;height:104px;position:relative;flex-shrink:0;}
.reactor .ring-outer{position:absolute;inset:0;border-radius:50%;border:1px dashed var(--cyan-dim);opacity:0.55;animation:spin-slow 22s linear infinite;}
.reactor .ring-outer2{position:absolute;inset:8px;border-radius:50%;border:1px solid var(--cyan-dim);opacity:0.4;animation:spin-rev 16s linear infinite;}
.reactor .ring-gauge{position:absolute;inset:14px;border-radius:50%;}
.reactor .core{
  position:absolute;inset:30px;border-radius:50%;background:radial-gradient(circle, var(--cyan-soft), var(--cyan) 60%, transparent 100%);
  box-shadow:0 0 22px 6px var(--cyan-glow), 0 0 50px 10px rgba(79,227,255,0.15);
  animation:pulse-glow 2.6s ease-in-out infinite;
}
.reactor-stats{display:flex;gap:32px;flex-wrap:wrap;flex:1;}
.reactor-stat-label{font-family:'Share Tech Mono';font-size:10px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;}
.reactor-stat-value{font-family:'Orbitron';font-size:24px;font-weight:600;color:var(--text);margin-top:5px;text-shadow:0 0 10px var(--cyan-glow);}
.reactor-stat-sub{font-family:'Share Tech Mono';font-size:10.5px;color:var(--cyan-dim);margin-top:3px;}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
.stat-card{padding:17px 18px 15px;}
.stat-label{font-family:'Share Tech Mono';font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);}
.stat-value{font-family:'Orbitron';font-size:27px;font-weight:600;margin-top:9px;color:var(--stat-color,var(--cyan));text-shadow:0 0 10px var(--cyan-glow);}
.stat-sub{font-size:11.5px;color:var(--muted-2);margin-top:5px;font-family:'Share Tech Mono';}

.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.section-title{font-family:'Orbitron';font-size:12.5px;text-transform:uppercase;letter-spacing:0.12em;color:var(--cyan-dim);}
.section-title::before{content:"// ";color:var(--muted-2);}

.tickets{display:flex;flex-direction:column;gap:10px;}
.ticket{padding:14px 18px;display:flex;align-items:center;gap:16px;cursor:pointer;border-left:2px solid var(--svc-color,var(--cyan-dim));transition:background .12s;}
.ticket:hover{background:rgba(79,227,255,0.05);}
.ticket-id{font-family:'Share Tech Mono';font-size:11px;color:var(--muted-2);width:66px;flex-shrink:0;}
.ticket-main{flex:1;min-width:0;}
.ticket-svc{font-size:14px;font-weight:700;color:var(--text);}
.ticket-meta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:11px;flex-wrap:wrap;font-family:'Share Tech Mono';}
.ticket-meta span{display:inline-flex;align-items:center;gap:4px;}
.blueseal-tag{font-family:'Share Tech Mono';font-size:9px;letter-spacing:0.07em;background:rgba(59,130,246,0.12);color:#7FB3FF;border:1px solid rgba(59,130,246,0.4);padding:1px 6px;border-radius:2px;}
.stamp{font-family:'Orbitron';font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:5px 11px;border-radius:2px;border:1.5px solid;flex-shrink:0;font-weight:600;}
.stamp.scheduled{color:var(--blue);border-color:var(--blue);box-shadow:0 0 8px rgba(59,130,246,0.25);}
.stamp.progress{color:var(--amber);border-color:var(--amber);box-shadow:0 0 8px rgba(255,176,32,0.25);}
.stamp.complete{color:var(--success);border-color:var(--success);box-shadow:0 0 8px rgba(57,240,176,0.25);}
.stamp.invoiced{color:var(--muted);border-color:var(--muted-2);}
.ticket-crew{display:flex;flex-shrink:0;}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--panel-solid);border:1.5px solid var(--cyan-dim);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;margin-left:-7px;color:var(--cyan-soft);}
.avatar:first-child{margin-left:0;}
.ticket-unassigned{font-family:'Share Tech Mono';font-size:10px;color:var(--danger);letter-spacing:0.05em;}

.table-wrap{overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-family:'Share Tech Mono';font-size:10px;text-transform:uppercase;letter-spacing:0.09em;color:var(--cyan-dim);padding:12px 18px;border-bottom:1px solid var(--border);background:rgba(79,227,255,0.03);}
td{padding:13px 18px;border-bottom:1px solid var(--border);font-size:13.5px;}
tr:last-child td{border-bottom:none;}
tbody tr{cursor:pointer;transition:background .1s;}
tbody tr:hover{background:rgba(79,227,255,0.05);}
.cell-mono{font-family:'Share Tech Mono';font-size:12px;color:var(--muted);}
.pill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:12px;display:inline-block;letter-spacing:0.03em;text-transform:uppercase;font-family:'Share Tech Mono';}
.pill.on{background:rgba(57,240,176,0.1);color:var(--success);border:1px solid rgba(57,240,176,0.3);}
.pill.off{background:rgba(255,255,255,0.04);color:var(--muted);border:1px solid var(--border);}
.pill.draft{background:rgba(255,255,255,0.04);color:var(--muted);border:1px solid var(--border);}
.pill.sent{background:rgba(59,130,246,0.1);color:#7FB3FF;border:1px solid rgba(59,130,246,0.3);}
.pill.approved{background:rgba(255,176,32,0.1);color:var(--amber);border:1px solid rgba(255,176,32,0.3);}
.pill.paid{background:rgba(57,240,176,0.1);color:var(--success);border:1px solid rgba(57,240,176,0.3);}

.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
select,input,textarea{
  font-family:'Rajdhani';font-weight:600;font-size:13.5px;background:var(--panel-solid);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;
}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 8px rgba(79,227,255,0.2);}

.empty{text-align:center;padding:50px 20px;color:var(--muted-2);border:1px dashed var(--border);border-radius:var(--radius);}
.empty svg{width:32px;height:32px;stroke:var(--muted-2);fill:none;stroke-width:1.5;margin-bottom:10px;}
.empty-title{font-family:'Orbitron';font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;}
.empty-sub{font-size:12.5px;font-family:'Share Tech Mono';}

.modal-backdrop{position:fixed;inset:0;background:rgba(2,6,10,0.75);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:5vh 16px;overflow-y:auto;}
.modal-backdrop.active{display:flex;}
.modal{background:var(--panel-solid);width:100%;max-width:480px;overflow:hidden;box-shadow:0 0 40px rgba(79,227,255,0.12), 0 20px 60px rgba(0,0,0,0.6);}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-head h2{font-family:'Orbitron';font-size:14.5px;text-transform:uppercase;letter-spacing:0.07em;color:var(--cyan);}
.modal-close{cursor:pointer;color:var(--muted);background:none;border:none;font-size:18px;padding:4px;}
.modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px;max-height:65vh;overflow-y:auto;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;color:var(--cyan-dim);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;font-family:'Share Tech Mono';}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.checkbox-row{display:flex;align-items:center;gap:9px;padding:10px 12px;background:rgba(79,227,255,0.03);border-radius:var(--radius);border:1px solid var(--border);}
.checkbox-row input{width:15px;height:15px;accent-color:var(--cyan);}
.checkbox-row label{font-size:12.5px;color:var(--text);font-family:'Rajdhani';font-weight:600;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;}
.crew-check-list{display:flex;flex-direction:column;gap:6px;max-height:140px;overflow-y:auto;}
.crew-check{display:flex;align-items:center;gap:9px;padding:7px 10px;background:rgba(79,227,255,0.03);border-radius:var(--radius);border:1px solid var(--border);}
.crew-check input{accent-color:var(--cyan);}
.crew-check span{font-size:12.5px;font-weight:600;}
.crew-check .role{color:var(--muted-2);font-size:10.5px;margin-left:auto;font-family:'Share Tech Mono';}

.status-btns{display:flex;gap:6px;flex-wrap:wrap;}
.status-btn{font-family:'Orbitron';font-size:10.5px;letter-spacing:0.05em;text-transform:uppercase;padding:6px 12px;border-radius:2px;border:1px solid var(--border);background:rgba(255,255,255,0.02);color:var(--muted);cursor:pointer;font-weight:600;}
.status-btn.active.scheduled{background:rgba(59,130,246,0.1);color:var(--blue);border-color:var(--blue);}
.status-btn.active.progress{background:rgba(255,176,32,0.1);color:var(--amber);border-color:var(--amber);}
.status-btn.active.complete{background:rgba(57,240,176,0.1);color:var(--success);border-color:var(--success);}
.status-btn.active.invoiced{background:rgba(255,255,255,0.05);color:var(--text);border-color:var(--muted-2);}

.mini-alert{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,176,32,0.06);border:1px solid rgba(255,176,32,0.3);border-radius:var(--radius);font-size:12.5px;color:var(--amber);margin-bottom:8px;font-family:'Share Tech Mono';}
.mini-alert svg{width:14px;height:14px;stroke:currentColor;fill:none;flex-shrink:0;}

/* ---- Assistant / Chat ---- */
.chat-panel{display:flex;flex-direction:column;height:calc(100vh - 172px);min-height:420px;padding:0;background:#05070A;}

/* ===== AI CORE VISUAL ===== */
.core-stage{
  position:relative;height:262px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;border-bottom:1px solid var(--border);
  background:
    radial-gradient(circle at 50% 45%, rgba(79,227,255,0.07), transparent 60%),
    #05070A;
}
.core-stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(79,227,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79,227,255,0.035) 1px, transparent 1px);
  background-size:26px 26px;
  mask-image:radial-gradient(circle at 50% 45%, black 0%, transparent 68%);
}
.core-rays{
  position:absolute;width:520px;height:520px;pointer-events:none;
  background:conic-gradient(from 0deg, transparent 0deg, rgba(139,110,255,0.05) 20deg, transparent 60deg, rgba(79,227,255,0.06) 120deg, transparent 170deg, rgba(139,110,255,0.04) 240deg, transparent 300deg, transparent 360deg);
  animation:spin-slow 40s linear infinite;
  mix-blend-mode:screen;
}
.orb-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}

/* 2D flat HUD overlay — rings/text/arc sit on top of the canvas, screen-facing, like the reference */
.hud2d{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:280px;height:280px;pointer-events:none;
  --hud-glow:0.6;
  filter:drop-shadow(0 0 calc(3px + var(--hud-glow)*4px) rgba(79,227,255,0.5));
}
.hud2d-bg{opacity:0.8;}
.hud2d-ticks{
  transform-origin:150px 150px;
  animation:hud-spin-rev 34s linear infinite;
  opacity:calc(0.5 + var(--hud-glow)*0.3);
}
@keyframes hud-spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
@keyframes hud-spin-rev{ from{transform:rotate(0deg);} to{transform:rotate(-360deg);} }

.core-stage.listening .hud2d-ticks{ animation-duration:14s; }
.core-stage.thinking .hud2d-ticks{ animation-duration:10s; }

@media (max-width:820px){
  .hud2d{width:220px;height:220px;}
}

.core-wrap{position:relative;width:236px;height:236px;display:flex;align-items:center;justify-content:center;z-index:2;}

/* gauge tick ring */
.tick-ring{position:absolute;inset:0;pointer-events:none;}
.tick{position:absolute;left:50%;top:50%;width:1.5px;height:7px;margin-left:-0.75px;background:rgba(79,227,255,0.3);transform-origin:50% 0%;}
.tick.major{height:10px;background:rgba(143,238,255,0.5);}
.tick-sweep-arc{
  position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg, transparent 0deg, transparent 315deg, rgba(255,176,32,0.95) 336deg, rgba(255,197,90,1) 350deg, rgba(255,176,32,0.95) 360deg);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 15px), #000 calc(100% - 14px) calc(100% - 4px), transparent calc(100% - 3px));
  mask:radial-gradient(farthest-side, transparent calc(100% - 15px), #000 calc(100% - 14px) calc(100% - 4px), transparent calc(100% - 3px));
  animation:spin-slow 10s linear infinite;
  filter:drop-shadow(0 0 5px rgba(255,176,32,0.65));
}
.core-stage.listening .tick-sweep-arc,.core-stage.speaking .tick-sweep-arc{animation-duration:4.5s;}
.core-stage.thinking .tick-sweep-arc{animation-duration:2.4s;}

.core-wordmark{
  position:absolute;z-index:5;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:'Orbitron';font-weight:700;font-size:13.5px;letter-spacing:0.22em;
  color:rgba(255,255,255,0.95);text-shadow:0 0 10px rgba(79,227,255,0.85),0 0 24px rgba(79,227,255,0.4);
  pointer-events:none;white-space:nowrap;
}

/* blueprint schematic backdrop */
.blueprint-circle{position:absolute;border:1px solid rgba(79,227,255,0.08);border-radius:50%;pointer-events:none;}
.blueprint-deco{
  position:absolute;font-family:'Share Tech Mono';font-size:8px;letter-spacing:0.09em;
  color:rgba(79,227,255,0.32);border:1px solid rgba(79,227,255,0.14);padding:3px 7px;
  pointer-events:none;background:rgba(79,227,255,0.02);
}

.core-ring{position:absolute;border-radius:50%;border-style:solid;box-sizing:border-box;}
.core-ring.r1{inset:0;border-width:1px;border-color:rgba(79,227,255,0.28);border-top-color:rgba(79,227,255,0.75);animation:spin-slow var(--ring1-speed,18s) linear infinite;}
.core-ring.r2{inset:16px;border-width:1px;border-color:rgba(139,110,255,0.22);border-style:dashed;animation:spin-rev var(--ring2-speed,26s) linear infinite;}
.core-ring.r3{inset:30px;border-width:1.5px;border-color:rgba(255,255,255,0.1);border-right-color:rgba(255,255,255,0.35);animation:spin-slow var(--ring3-speed,12s) linear infinite;}

.spectrum-ring{position:absolute;inset:0;width:236px;height:236px;pointer-events:none;}
.spectrum-bar{position:absolute;left:50%;top:50%;width:2px;height:9px;margin-left:-1px;transform-origin:50% 0%;}
.spectrum-bar .fill{
  width:100%;height:100%;border-radius:2px;
  background:linear-gradient(180deg, rgba(255,255,255,0.9), var(--cyan) 55%, rgba(139,110,255,0.6));
  transform:scaleY(0.25);transform-origin:50% 0%;
  box-shadow:0 0 6px rgba(79,227,255,0.5);
  transition:transform .06s linear;
}

.core-sphere{
  position:relative;width:104px;height:104px;border-radius:50%;
  background:
    radial-gradient(circle at 36% 30%, rgba(255,255,255,0.75), rgba(190,245,255,0.55) 16%, rgba(100,215,255,0.42) 34%, rgba(50,160,220,0.32) 58%, rgba(20,80,130,0.28) 80%, rgba(8,30,50,0.35) 100%);
  box-shadow:
    0 0 40px 10px rgba(79,227,255,var(--glow,0.4)),
    0 0 80px 24px rgba(139,110,255,calc(var(--glow,0.4) * 0.6)),
    inset 0 0 22px rgba(255,255,255,0.16),
    inset 0 -14px 30px rgba(0,10,20,0.4);
  backdrop-filter:blur(1px);
  transform:scale(var(--core-scale,1));
  transition:box-shadow .15s ease;
  animation:core-breathe 4.2s ease-in-out infinite;
}
.core-sphere-inner{
  position:absolute;inset:16px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, rgba(255,255,255,0.4), rgba(120,220,255,0.3) 45%, transparent 75%);
  filter:blur(2px);
  animation:pulse-glow 2.6s ease-in-out infinite;
}
.core-highlight{
  position:absolute;width:24px;height:15px;border-radius:50%;
  background:rgba(255,255,255,0.45);filter:blur(3px);
  top:19%;left:29%;animation:highlight-drift 7s ease-in-out infinite;
}
@keyframes core-breathe{0%,100%{filter:brightness(1);}50%{filter:brightness(1.12);}}
@keyframes highlight-drift{0%,100%{transform:translate(0,0);opacity:.5;}50%{transform:translate(6px,4px);opacity:.72;}}

.neural-lines{position:absolute;inset:-40px;pointer-events:none;}

.core-state-label{
  position:absolute;bottom:14px;left:0;right:0;text-align:center;z-index:3;
  font-family:'Share Tech Mono';font-size:11px;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--cyan-dim);transition:color .2s;
}
.core-stage.listening .core-state-label{color:var(--cyan);text-shadow:0 0 8px var(--cyan-glow);}
.core-stage.thinking .core-state-label{color:#B79CFF;text-shadow:0 0 8px rgba(139,110,255,0.5);}
.core-stage.speaking .core-state-label{color:var(--cyan-soft);text-shadow:0 0 10px var(--cyan-glow);}

.core-stage.listening .core-ring.r1{border-top-color:#fff;}
.core-stage.thinking .core-ring{border-color:rgba(139,110,255,0.35);}
.core-stage.speaking .core-sphere{box-shadow:0 0 46px 12px rgba(79,227,255,var(--glow,0.5)), 0 0 90px 26px rgba(139,110,255,calc(var(--glow,0.5)*0.7)), inset 0 0 30px rgba(0,4,10,0.6);}

.chat-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.chat-status-dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 6px var(--success);animation:pulse-glow 2s ease-in-out infinite;flex-shrink:0;}
.chat-head-title{font-family:'Orbitron';font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--cyan);}
.chat-head-sub{font-family:'Share Tech Mono';font-size:10px;color:var(--muted-2);margin-left:auto;}
.voice-toggle{
  flex-shrink:0;width:30px;height:30px;border-radius:50%;border:1px solid var(--border);
  background:rgba(79,227,255,0.04);color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .12s;
}
.voice-toggle svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;}
.voice-toggle.on{color:var(--cyan);border-color:var(--cyan-dim);box-shadow:0 0 8px rgba(79,227,255,0.15);}
.voice-toggle:hover{filter:brightness(1.2);}
.speaking-indicator{display:flex;align-items:center;gap:2px;height:14px;}
.speaking-indicator span{width:2.5px;background:var(--cyan);border-radius:2px;animation:speak-bar 0.9s ease-in-out infinite;box-shadow:0 0 4px var(--cyan-glow);}
.speaking-indicator span:nth-child(1){height:6px;animation-delay:0s;}
.speaking-indicator span:nth-child(2){height:12px;animation-delay:.15s;}
.speaking-indicator span:nth-child(3){height:8px;animation-delay:.3s;}
.speaking-indicator span:nth-child(4){height:14px;animation-delay:.45s;}
@keyframes speak-bar{0%,100%{transform:scaleY(0.4);}50%{transform:scaleY(1);}}
.mic-btn{
  flex-shrink:0;width:42px;height:42px;border-radius:50%;border:1px solid var(--border);
  background:rgba(79,227,255,0.04);color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;position:relative;
}
.mic-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;}
.mic-btn:hover{color:var(--cyan-soft);border-color:var(--cyan-dim);}
.mic-btn.listening{color:#00151A;background:var(--danger);border-color:var(--danger);box-shadow:0 0 16px rgba(255,77,94,0.5);}
.mic-btn.listening::before{
  content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--danger);
  opacity:.6;animation:mic-pulse 1.4s ease-out infinite;
}
@keyframes mic-pulse{0%{transform:scale(0.85);opacity:.7;}100%{transform:scale(1.5);opacity:0;}}
.mic-unsupported{opacity:0.35;cursor:not-allowed;}

/* voice-only control row */
.voice-control-row{
  flex-shrink:0;padding:22px 20px 26px;display:flex;flex-direction:column;
  align-items:center;gap:10px;border-top:1px solid var(--border);
}
.mic-btn-lg{width:64px;height:64px;}
.mic-btn-lg svg{width:24px;height:24px;}
.voice-hint{font-family:'Share Tech Mono';font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted-2);}

.core-caption{
  position:absolute;bottom:40px;left:50%;transform:translate(-50%,8px);
  max-width:86%;text-align:center;font-family:'Rajdhani';font-weight:600;font-size:13.5px;
  color:var(--text);line-height:1.5;z-index:4;pointer-events:none;
  opacity:0;transition:opacity .3s ease, transform .3s ease;
}
.core-caption.show{opacity:1;transform:translate(-50%,0);}
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;}
.chat-msg-block{display:flex;flex-direction:column;max-width:80%;}
.chat-msg-block.user{align-self:flex-end;align-items:flex-end;}
.chat-msg-block.assistant{align-self:flex-start;align-items:flex-start;}
.chat-msg-label{font-family:'Share Tech Mono';font-size:9.5px;color:var(--cyan-dim);letter-spacing:0.1em;margin-bottom:5px;text-transform:uppercase;}
.chat-msg{padding:11px 15px;border-radius:3px;font-size:13.5px;line-height:1.55;font-family:'Rajdhani';font-weight:500;white-space:pre-wrap;}
.chat-msg-block.user .chat-msg{background:rgba(79,227,255,0.08);border:1px solid var(--cyan-dim);color:var(--text);}
.chat-msg-block.assistant .chat-msg{background:var(--panel-solid);border:1px solid var(--border);color:var(--text);}
.chat-thinking{font-family:'Share Tech Mono';font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:8px;padding:2px 2px;}
.chat-thinking .dots span{animation:pulse-glow 1s ease-in-out infinite;}
.chat-thinking .dots span:nth-child(2){animation-delay:.15s;}
.chat-thinking .dots span:nth-child(3){animation-delay:.3s;}
.chat-suggestions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px 0;}
.chip{font-family:'Share Tech Mono';font-size:10.5px;padding:6px 12px;border:1px solid var(--cyan-dim);border-radius:14px;color:var(--cyan-dim);cursor:pointer;background:rgba(79,227,255,0.03);transition:background .12s,color .12s;}
.chip:hover{background:rgba(79,227,255,0.1);color:var(--cyan);}
.chat-input-row{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end;}
.chat-input-row textarea{flex:1;resize:none;font-family:'Rajdhani';font-weight:500;min-height:42px;max-height:120px;}
.chat-send-btn{flex-shrink:0;height:42px;}
.chat-empty{margin:auto;text-align:center;color:var(--muted-2);padding:30px;}
.chat-empty svg{width:34px;height:34px;stroke:var(--cyan-dim);fill:none;stroke-width:1.4;margin-bottom:12px;}
.chat-empty-title{font-family:'Orbitron';font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:5px;}
.chat-empty-sub{font-size:12.5px;font-family:'Share Tech Mono';max-width:340px;margin:0 auto;}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel-solid);border:1px solid var(--cyan-dim);color:var(--text);padding:11px 20px;border-radius:var(--radius);font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .2s;z-index:200;display:flex;align-items:center;gap:8px;box-shadow:0 0 20px rgba(79,227,255,0.15);font-family:'Rajdhani';}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast .dot{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 6px var(--success);}

@media (max-width:820px){
  .sidebar{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:60px;flex-direction:row;border-right:none;border-top:1px solid var(--border);z-index:50;}
  .brand,.sidebar-foot{display:none;}
  .nav{flex-direction:row;padding:6px;justify-content:space-around;flex:1;}
  .nav-item{flex-direction:column;gap:3px;font-size:9.5px;padding:6px 8px;flex:1;text-align:center;}
  .nav-count{display:none;}
  .main{padding-bottom:60px;}
  .stats-grid{grid-template-columns:1fr 1fr;}
  .content{padding:16px;}
  .field-row{flex-direction:column;}
  .topbar{padding:0 16px;}
  .reactor-panel{padding:16px;gap:16px;}
  .reactor{width:80px;height:80px;}
  .core-stage{height:200px;}
  .core-wrap{width:186px;height:186px;}
  .spectrum-ring{width:186px;height:186px;}
  .core-wordmark{font-size:10.5px;}
}
</style>
</head>

<script>
const SERVICES = [
  {id:"demo_int_ext", label:"Interior & Exterior Demolition", color:"#4FE3FF"},
  {id:"junk", label:"Junk Removal", color:"#39F0B0"},
  {id:"moving", label:"Moving In / Out", color:"#3B82F6"},
  {id:"equip_transport", label:"Equipment Transportation", color:"#B98CD6"},
  {id:"packing", label:"Packing / Unpacking", color:"#FFB020"},
  {id:"commercial_clean", label:"Commercial Clean Up", color:"#4FE3FF"},
  {id:"residential_clean", label:"Residential Clean Up", color:"#4FE3FF"},
  {id:"landscaping", label:"Landscaping", color:"#39F0B0"},
  {id:"fkb_demo", label:"Flooring / Kitchen / Bathroom Demolition", color:"#4FE3FF"},
  {id:"concrete_demo", label:"Concrete Demolition", color:"#9C9C9C"},
  {id:"blue_seal", label:"Blue Seal", color:"#3B82F6"},
];
const svcMap = Object.fromEntries(SERVICES.map(s=>[s.id,s]));

const STATUS_ORDER = ["scheduled","progress","complete","invoiced"];
const STATUS_LABEL = {scheduled:"Scheduled",progress:"In Progress",complete:"Complete",invoiced:"Invoiced"};

let DATA = { jobs: [], customers: [], crew: [], quotes: [], nextId: 1 };
let currentView = "dashboard";
let editingJobId = null, editingCustId = null, editingCrewId = null, editingQuoteId = null;

const STORAGE_KEY = "shift-smash-data-v1";
let lastKnownRev = 0;
let syncPollHandle = null;
let isEditingModal = false; // pause sync while a modal is open, to avoid yanking data mid-edit

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){
      DATA = JSON.parse(res.value);
      lastKnownRev = DATA._rev || 0;
    } else {
      seedData();
      DATA._rev = 1;
      lastKnownRev = 1;
      await saveData();
    }
  }catch(e){
    seedData();
    DATA._rev = 1;
    lastKnownRev = 1;
    try{ await saveData(); }catch(e2){}
  }
  render();
  startSyncPolling();
}

async function saveData(){
  DATA._rev = (DATA._rev || 0) + 1;
  lastKnownRev = DATA._rev;
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(DATA), true);
  }catch(e){
    console.error("Storage save failed", e);
    showToast("Couldn't save - changes may not persist");
  }
}

function startSyncPolling(){
  if(syncPollHandle) return;
  syncPollHandle = setInterval(async ()=>{
    if(isEditingModal) return; // don't yank data out from under an open form
    try{
      const res = await window.storage.get(STORAGE_KEY, true);
      if(!res || !res.value) return;
      const incoming = JSON.parse(res.value);
      if((incoming._rev||0) > lastKnownRev){
        DATA = incoming;
        lastKnownRev = incoming._rev;
        render();
        showToast("Synced updates from your team");
      }
    }catch(e){ /* quiet fail — try again next tick */ }
  }, 4000);
}


function seedData(){
  DATA = {
    jobs: [
      {id:1, customerId:1, service:"demo_int_ext", address:"48 Harrow St, Unit 2", date: todayISO(), value:4200, status:"progress", crew:[1,2], blueSeal:true, notes:"Kitchen + two bathrooms, load-bearing wall assessed by engineer."},
      {id:2, customerId:2, service:"moving", address:"901 Colborne Ave", date: todayISO(), value:1350, status:"scheduled", crew:[3], blueSeal:false, notes:"3rd floor walk-up, no elevator."},
      {id:3, customerId:3, service:"junk", address:"12 Elmwood Cres", date: offsetISO(1), value:600, status:"scheduled", crew:[], blueSeal:false, notes:""},
      {id:4, customerId:1, service:"concrete_demo", address:"48 Harrow St, Unit 2", date: offsetISO(-2), value:2800, status:"complete", crew:[1,3], blueSeal:true, notes:"Driveway slab + footings."},
      {id:5, customerId:4, service:"landscaping", address:"77 Birchmount Rd", date: offsetISO(-6), value:950, status:"invoiced", crew:[3], blueSeal:false, notes:""},
    ],
    customers: [
      {id:1, name:"Rivera Properties LLC", phone:"(555) 401-2290", email:"jane@riveraprop.com", address:"48 Harrow St, Unit 2", notes:"Repeat client - flips 3-4 properties/year."},
      {id:2, name:"Tom Whitfield", phone:"(555) 220-8817", email:"twhitfield@mail.com", address:"901 Colborne Ave", notes:""},
      {id:3, name:"Nadia Petrov", phone:"(555) 774-3301", email:"n.petrov@mail.com", address:"12 Elmwood Cres", notes:""},
      {id:4, name:"Birchmount HOA", phone:"(555) 660-0044", email:"admin@birchmounthoa.org", address:"77 Birchmount Rd", notes:"Quarterly landscaping contract."},

function todayISO(){ return new Date().toISOString().slice(0,10); }
function offsetISO(days){ const d=new Date(); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function fmtDate(iso){
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function fmtMoney(n){ return "$" + Number(n||0).toLocaleString('en-US'); }
function nextId(){ return DATA.nextId++; }
function initials(name){ return (name||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }

function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
  if(typeof triggerRipple === "function") triggerRipple();
}

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = NAV_ITEMS.map(item=>{
    let count = "";
    if(item.id==="jobs") count = DATA.jobs.filter(j=>j.status!=="invoiced").length;
    if(item.id==="customers") count = DATA.customers.length;
    if(item.id==="crew") count = DATA.crew.filter(c=>c.active).length;
    if(item.id==="quotes") count = DATA.quotes.filter(q=>q.status!=="paid").length;
    return '<div class="nav-item '+(item.id===currentView?'active':'')+'" data-view="'+item.id+'">'
      + '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">'+item.icon+'</svg>'
      + '<span class="label-text">'+item.label+'</span>'
      + (count!==""? '<span class="nav-count">'+count+'</span>':"")
      + '</div>';
  }).join("");
  nav.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{ currentView = el.dataset.view; render(); });
  });
}

function render(){
  renderNav();
  const titles = {dashboard:"Dashboard", jobs:"Jobs", customers:"Customers", crew:"Crew", quotes:"Quotes & Invoices", assistant:"Jarvis"};
  document.getElementById('viewTitle').textContent = titles[currentView];
  const content = document.getElementById('content');
  if(currentView==="dashboard") content.innerHTML = renderDashboard();
  else if(currentView==="jobs") content.innerHTML = renderJobs();
  else if(currentView==="customers") content.innerHTML = renderCustomers();
  else if(currentView==="crew") content.innerHTML = renderCrew();
  else if(currentView==="quotes") content.innerHTML = renderQuotes();
  else if(currentView==="assistant") content.innerHTML = renderAssistantShell();
  bindContentEvents();
  if(currentView==="assistant") initAssistantView();
}

function renderDashboard(){
  const today = todayISO();
  const activeJobs = DATA.jobs.filter(j=>j.status!=="invoiced");
  const weekRevenue = DATA.jobs.filter(j=>{
    const d = new Date(j.date+"T00:00:00"); const now = new Date();
    const diff = (now - d)/86400000;
    return diff>=0 && diff<=7 && (j.status==="complete"||j.status==="invoiced");
  }).reduce((s,j)=>s+Number(j.value||0),0);
  const crewOnDuty = DATA.crew.filter(c=>c.active).length;
  const utilization = DATA.crew.length ? Math.round((crewOnDuty/DATA.crew.length)*100) : 0;
  const pendingQuotes = DATA.quotes.filter(q=>q.status==="draft"||q.status==="sent").length;

  const todaysJobs = DATA.jobs.filter(j=>j.date===today).sort((a,b)=>a.status.localeCompare(b.status));
  const unassigned = DATA.jobs.filter(j=>j.crew.length===0 && j.status!=="invoiced" && j.status!=="complete");

  return '<div class="reactor-panel">'
    + '<div class="reactor-stats">'
      + '<div><div class="reactor-stat-label">Crew Readiness</div><div class="reactor-stat-value">'+utilization+'%</div><div class="reactor-stat-sub">'+crewOnDuty+' / '+DATA.crew.length+' ON DUTY</div></div>'
      + '<div><div class="reactor-stat-label">Active Jobs</div><div class="reactor-stat-value">'+activeJobs.length+'</div><div class="reactor-stat-sub">'+DATA.jobs.filter(j=>j.status==='progress').length+' IN PROGRESS</div></div>'
      + '<div><div class="reactor-stat-label">Week Revenue</div><div class="reactor-stat-value">'+fmtMoney(weekRevenue)+'</div><div class="reactor-stat-sub">COMPLETED &amp; INVOICED</div></div>'
      + '<div><div class="reactor-stat-label">Pending Quotes</div><div class="reactor-stat-value">'+pendingQuotes+'</div><div class="reactor-stat-sub">AWAITING RESPONSE</div></div>'
    + '</div>'
  + '</div>'
  + (unassigned.length ? '<div class="mini-alert"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9L2.7 17a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>'+unassigned.length+' job'+(unassigned.length>1?'s':'')+' scheduled with no crew assigned - check the Jobs board.</div>' : "")
  + '<div class="section-head"><div class="section-title">Today\'s Jobs - '+fmtDate(today)+'</div></div>'
  + (todaysJobs.length ? '<div class="tickets" style="margin-bottom:30px;">'+todaysJobs.map(renderTicket).join("")+'</div>'
      : '<div class="empty" style="margin-bottom:30px;"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><div class="empty-title">Nothing on the board today</div><div class="empty-sub">Enjoy it while it lasts.</div></div>')
  + '<div class="section-head"><div class="section-title">Upcoming</div></div>'
  + '<div class="tickets">'
    + (DATA.jobs.filter(j=>j.date>today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).map(renderTicket).join("") || '<div class="empty"><div class="empty-title">No upcoming jobs scheduled</div></div>')
  + '</div>';
}

function renderTicket(j){
  const svc = svcMap[j.service] || {label:j.service, color:"#888"};
  const cust = DATA.customers.find(c=>c.id===j.customerId);
  const crewNames = j.crew.map(cid => DATA.crew.find(c=>c.id===cid)).filter(Boolean);
  return '<div class="ticket" style="--svc-color:'+svc.color+'" data-job="'+j.id+'">'
    + '<div class="ticket-id">#JOB-'+String(j.id).padStart(3,'0')+'</div>'
    + '<div class="ticket-main">'
      + '<div class="ticket-svc">'+svc.label+(j.blueSeal ? ' <span class="blueseal-tag">BLUE SEAL</span>':'')+'</div>'
      + '<div class="ticket-meta"><span>'+(cust ? cust.name : 'Unknown customer')+'</span><span>'+(j.address||'')+'</span><span>'+fmtDate(j.date)+'</span><span style="color:var(--text)">'+fmtMoney(j.value)+'</span></div>'
    + '</div>'
    + '<div class="stamp '+j.status+'">'+STATUS_LABEL[j.status]+'</div>'
    + (crewNames.length ? '<div class="ticket-crew">'+crewNames.map(c=>'<div class="avatar" title="'+c.name+'">'+initials(c.name)+'</div>').join("")+'</div>' : '<div class="ticket-unassigned">UNASSIGNED</div>')
  + '</div>';
}

let jobFilterStatus = "all", jobFilterService = "all";
function renderJobs(){
  let jobs = DATA.jobs.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(jobFilterStatus!=="all") jobs = jobs.filter(j=>j.status===jobFilterStatus);
  if(jobFilterService!=="all") jobs = jobs.filter(j=>j.service===jobFilterService);

  return '<div class="filters">'
    + '<select id="filterStatus"><option value="all">All statuses</option>'
      + STATUS_ORDER.map(s=>'<option value="'+s+'" '+(jobFilterStatus===s?'selected':'')+'>'+STATUS_LABEL[s]+'</option>').join("")
    + '</select>'
    + '<select id="filterService"><option value="all">All services</option>'
      + SERVICES.map(s=>'<option value="'+s.id+'" '+(jobFilterService===s.id?'selected':'')+'>'+s.label+'</option>').join("")
    + '</select>'
  + '</div>'
  + '<div class="tickets">'

  document.querySelectorAll('.ticket').forEach(el=>{

  document.querySelectorAll('tr[data-crew]').forEach(el=>{

    el.addEventListener('click', ()=> openQuoteModal(Number(el.dataset.quote)));

  if(fs) fs.addEventListener('change', e=>{ jobFilterStatus = e.target.value; render(); });
  const fsv = document.getElementById('filterService');

function openJobModal(id){
  editingJobId = id;
  const custSel = document.getElementById('jf-customer');
  custSel.innerHTML = DATA.customers.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join("") || '<option value="">Add a customer first</option>';
  const svcSel = document.getElementById('jf-service');
  svcSel.innerHTML = SERVICES.map(s=>'<option value="'+s.id+'">'+s.label+'</option>').join("");
  const crewWrap = document.getElementById('jf-crew');
  crewWrap.innerHTML = DATA.crew.map(c=>'<div class="crew-check"><input type="checkbox" value="'+c.id+'" id="crewpick-'+c.id+'"><span>'+c.name+'</span><span class="role">'+c.role+'</span></div>').join("") || '<div style="font-size:12px;color:var(--muted-2)">No crew added yet.</div>';

  document.getElementById('jf-delete').style.display = id ? 'inline-flex' : 'none';

  if(id){
    const j = DATA.jobs.find(x=>x.id===id);
    document.getElementById('jobModalTitle').textContent = 'Job #JOB-'+String(id).padStart(3,'0');
    custSel.value = j.customerId;
    svcSel.value = j.service;
    document.getElementById('jf-address').value = j.address||"";
    document.getElementById('jf-date').value = j.date||"";
    document.getElementById('jf-value').value = j.value||"";
    document.getElementById('jf-blueseal').checked = !!j.blueSeal;
    document.getElementById('jf-notes').value = j.notes||"";
    j.crew.forEach(cid=>{ const cb=document.getElementById('crewpick-'+cid); if(cb) cb.checked=true; });
    renderStatusPicker(j.status);
  } else {
    document.getElementById('jobModalTitle').textContent = "New Job";
    document.getElementById('jf-address').value = "";
    document.getElementById('jf-date').value = todayISO();
    document.getElementById('jf-value').value = "";
    document.getElementById('jf-blueseal').checked = false;
    document.getElementById('jf-notes').value = "";
    renderStatusPicker("scheduled");
  }
  openModal('jobModal');
}

function renderStatusPicker(current){
  let holder = document.getElementById('jf-status-holder');
  if(!holder){
    holder = document.createElement('div');
    holder.className = 'field';
    holder.id = 'jf-status-holder';
    holder.innerHTML = '<label>Status</label><div class="status-btns" id="jf-status-btns"></div>';
    document.querySelector('#jobModalBackdrop .modal-body').insertBefore(holder, document.querySelector('#jobModalBackdrop .modal-body').firstChild.nextSibling);
  }
  const btns = document.getElementById('jf-status-btns');
  btns.dataset.value = current;
  btns.innerHTML = STATUS_ORDER.map(s=>'<button type="button" class="status-btn '+(s===current?'active '+s:'')+'" data-status="'+s+'">'+STATUS_LABEL[s]+'</button>').join("");
  btns.querySelectorAll('.status-btn').forEach(b=>{
    b.addEventListener('click', ()=>{ btns.dataset.value = b.dataset.status; renderStatusPicker(b.dataset.status); });
  });
}

document.getElementById('jf-save').addEventListener('click', async ()=>{
  const custId = Number(document.getElementById('jf-customer').value);
  if(!custId){ showToast("Add a customer before creating a job"); return; }
  const crewIds = Array.from(document.querySelectorAll('#jf-crew input:checked')).map(cb=>Number(cb.value));
  const statusBtns = document.getElementById('jf-status-btns');
  const payload = {
    customerId: custId,
    service: document.getElementById('jf-service').value,
    address: document.getElementById('jf-address').value,
    date: document.getElementById('jf-date').value || todayISO(),
    value: Number(document.getElementById('jf-value').value)||0,
    status: statusBtns ? statusBtns.dataset.value : "scheduled",
    crew: crewIds,
    blueSeal: document.getElementById('jf-blueseal').checked,
    notes: document.getElementById('jf-notes').value,
  };
  if(editingJobId){
    const j = DATA.jobs.find(x=>x.id===editingJobId);
    Object.assign(j, payload);
    showToast("Job updated");
  } else {
    payload.id = nextId();
    DATA.jobs.push(payload);
    showToast("Job created");
  }
  await saveData();
  closeModal('jobModal');
  render();
});
document.getElementById('jf-delete').addEventListener('click', async ()=>{
  if(!editingJobId) return;
  DATA.jobs = DATA.jobs.filter(j=>j.id!==editingJobId);
  await saveData();
  closeModal('jobModal');
  showToast("Job deleted");
  render();
});

function openQuoteModal(id){
  editingQuoteId = id;
  const custSel = document.getElementById('qf-customer');
  custSel.innerHTML = DATA.customers.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join("") || '<option value="">Add a customer first</option>';
  const jobSel = document.getElementById('qf-job');
  document.getElementById('qf-delete').style.display = id ? 'inline-flex' : 'none';

  function refreshJobOptions(custId){
    const jobs = DATA.jobs.filter(j=>j.customerId===Number(custId));
    jobSel.innerHTML = '<option value="">- none -</option>' + jobs.map(j=>'<option value="'+j.id+'">#JOB-'+String(j.id).padStart(3,'0')+' - '+svcMap[j.service].label+'</option>').join("");

/* ============ VOICE ============ */
let voiceOutputEnabled = true;
let isListening = false;
let micStuckTimer = null;
let isSpeaking = false;
let recognition = null;
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRecognitionAPI){
  recognition = new SpeechRecognitionAPI();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
}

let cachedVoices = [];
function loadVoicesList(){
  if(!('speechSynthesis' in window)) return;
  cachedVoices = window.speechSynthesis.getVoices();
}
if('speechSynthesis' in window){
  loadVoicesList();
  window.speechSynthesis.onvoiceschanged = loadVoicesList;
}

function pickVoice(){
  const voices = cachedVoices.length ? cachedVoices : (window.speechSynthesis ? window.speechSynthesis.getVoices() : []);
  if(!voices.length) return null;
  const british = voices.filter(v=>/en-GB|en_GB/i.test(v.lang));
  // Prefer named, natural-sounding British male voices (common across Chrome/Edge/Safari/Windows)
  const preferredNames = /Ryan|Thomas|George|Arthur|Oliver|Daniel|Google UK English Male/i;
  let pick = british.find(v=>preferredNames.test(v.name) && /Natural|Online|Neural/i.test(v.name));
  if(!pick) pick = british.find(v=>preferredNames.test(v.name));
  if(!pick) pick = british.find(v=>/Male/i.test(v.name));
  if(!pick) pick = british[0];
  if(!pick) pick = voices.find(v=>/en/i.test(v.lang));
  return pick || voices[0] || null;
}

function speak(text){
  if(!voiceOutputEnabled || !text){ setJarvisState("idle"); return; }
  if(!('speechSynthesis' in window)){ setJarvisState("idle"); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.98;
  utter.pitch = 0.95;
  const v = pickVoice();
  if(v) utter.voice = v;
  utter.onstart = ()=>{ isSpeaking = true; updateSpeakingIndicator(); speakPulses=[]; speakBaseSeed=Math.random()*1000; setJarvisState("speaking"); };
  utter.onboundary = (e)=>{
    speakPulses.push({ start: performance.now(), decay: 180 + Math.random()*140, strength: 0.35 + Math.random()*0.4 });
  };
  utter.onend = ()=>{ isSpeaking = false; updateSpeakingIndicator(); setJarvisState("idle"); };
  utter.onerror = ()=>{ isSpeaking = false; updateSpeakingIndicator(); setJarvisState("idle"); };
  window.speechSynthesis.speak(utter);
}

function updateSpeakingIndicator(){
  const el = document.getElementById('speakingIndicator');
  if(!el) return;
  el.innerHTML = isSpeaking ? '<span class="speaking-indicator"><span></span><span></span><span></span><span></span></span>' : '';
}

function updateVoiceToggleUI(){
  const btn = document.getElementById('voiceToggleBtn');
  if(!btn) return;
  btn.classList.toggle('on', voiceOutputEnabled);
}

function startListening(){
  if(!recognition){ showToast("Voice input isn't supported in this browser"); return; }
  if(isListening) return;
  if(!window.isSecureContext){
    showToast("Mic needs a secure context (https or localhost) — see notes below");
    return;
  }
  isListening = true;
  updateMicUI();
  setJarvisState("listening");
  if(typeof triggerWakeFlash === "function") triggerWakeFlash();
  startMicAnalysis();
  let finalTranscript = "";
  recognition.onresult = (e)=>{
    let interim = "";
    for(let i=e.resultIndex; i<e.results.length; i++){
      const t = e.results[i][0].transcript;
      if(e.results[i].isFinal) finalTranscript += t;
      else interim += t;
    }
  };
  recognition.onerror = (e)=>{
    clearTimeout(micStuckTimer);
    isListening = false; updateMicUI(); stopMicAnalysis(); setJarvisState("idle");
    const reasons = {
      'not-allowed': "Mic access was blocked — check browser/site permissions",
      'service-not-allowed': "Mic access blocked by this environment (likely the embedded preview)",
      'no-speech': "Didn't catch that — try again",
      'audio-capture': "No microphone found",
    };
    showToast(reasons[e.error] || ("Mic error: " + e.error));
  };
  recognition.onend = ()=>{
    clearTimeout(micStuckTimer);
    isListening = false;
    updateMicUI();
    stopMicAnalysis();
    const val = finalTranscript.trim();
    if(val){ sendAssistantMessage(val); }
    else {
      setJarvisState("idle");
      showToast("Didn't catch anything — check mic permissions, or try a real browser tab (not this preview)");
    }
  };
  try{ recognition.start(); }
  catch(e){ isListening=false; updateMicUI(); stopMicAnalysis(); setJarvisState("idle"); showToast("Couldn't start the mic: " + e.message); }

  clearTimeout(micStuckTimer);
  micStuckTimer = setTimeout(()=>{
    if(isListening){
      try{ recognition.stop(); }catch(e){}
      isListening = false; updateMicUI(); stopMicAnalysis(); setJarvisState("idle");
      showToast("Mic never responded — this preview likely can't access it. Try a real browser tab.");
    }
  }, 8000);
}
function stopListening(){
  if(recognition && isListening){ recognition.stop(); }
}
function updateMicUI(){
  const btn = document.getElementById('micBtn');
  if(!btn) return;
  btn.classList.toggle('listening', isListening);
}

let orbRenderer=null, orbScene=null, orbCamera=null;
let coreGroup=null, orbMesh=null;
let networkGroup=null, networkNodes=null, networkEdges=null;
let isDragging=false, dragSparks=[], dragSparkTex=null, dragListenerCleanup=null, lastDragPos=null;
let bgParticles=null, fgParticles=null, glowSprite1=null, glowSprite2=null;
let shadowSprite=null, orbitSparks=[];
let waveMeshes=[], arcLines=[], waveformBars=[], rippleSprite=null;
let smoothedActivity=0.15, smoothedVolume=0, lastVolume=0;
let wakeFlashT=-10; // time of last wake flash trigger; <0 = none pending
let rippleQueue=[]; // {start}
let orbCanvasEl=null;

async function startMicAnalysis(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === "suspended") await audioCtx.resume();
    micStream = await navigator.mediaDevices.getUserMedia({audio:true});
    micSource = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    analyser.smoothingTimeConstant = 0.75;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    micSource.connect(analyser);
  }catch(e){
    console.error("Mic analysis unavailable", e);
  }
}
function stopMicAnalysis(){
  if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream = null; }
  if(micSource){ try{ micSource.disconnect(); }catch(e){} micSource = null; }
  analyser = null; freqData = null;
}

function currentVolume(t){
  if(jarvisState==="listening"){
    if(analyser && freqData){
      analyser.getByteFrequencyData(freqData);
      let sum=0; for(let i=0;i<freqData.length;i++) sum+=freqData[i];
      return Math.min(1,(sum/freqData.length)/70);
    }
    return 0.15;
  }
  if(jarvisState==="speaking"){
    let pulseEnergy=0; const now=performance.now();
    speakPulses = speakPulses.filter(p=>now-p.start<p.decay);
    speakPulses.forEach(p=>{ const age=(now-p.start)/p.decay; pulseEnergy+=p.strength*(1-age); });
    const base=0.2+0.1*Math.sin(t*3.2);
    return Math.min(1, Math.max(0.12, base+pulseEnergy));
  }
  if(jarvisState==="thinking") return 0.26+0.08*Math.sin(t*2.1);
  return 0.07+0.03*Math.sin(t*0.6); // idle
}

function setJarvisState(state){
  jarvisState = state;
  const stage = document.getElementById('coreStage');
  const label = document.getElementById('coreStateLabel');
  if(!stage || !label) return;
  stage.classList.remove('idle','listening','thinking','speaking');
  stage.classList.add(state);
  const labels = { idle:"JARVIS ONLINE", listening:"LISTENING...", thinking:"THINKING...", speaking:"SPEAKING..." };
  label.textContent = labels[state] || "JARVIS ONLINE";
}

function makeGlowTexture(){
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0, 'rgba(160,225,255,0.9)');
  g.addColorStop(0.4, 'rgba(100,190,255,0.35)');
  g.addColorStop(1, 'rgba(100,190,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}

const ORB_VERTEX_SHADER = `
  varying vec3 vViewNormal;
  void main(){
    vViewNormal = normalize(normalMatrix * normal);
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const ORB_FRAGMENT_SHADER = `
  uniform float uGlow;
  varying vec3 vViewNormal;
  void main(){
    vec3 siteCyan = vec3(0.310, 0.890, 1.0);
    float rim = 1.0 - abs(vViewNormal.z);
    vec3 col = siteCyan * pow(rim, 2.2) * (0.55 + uGlow*0.6);
    float alpha = pow(rim, 1.6) * 0.5 + 0.035;
    gl_FragColor = vec4(col, alpha);
  }
`;

function init3DOrb(){
  orbCanvasEl = document.getElementById('orbCanvas');
  if(!orbCanvasEl) return;
  if(typeof THREE === "undefined"){
    console.error("Three.js failed to load — check network/CDN access");
    showToast("3D engine failed to load — check your connection and reload");
    const label = document.getElementById('coreStateLabel');
    if(label) label.textContent = "3D ENGINE UNAVAILABLE";
    return;
  }
  const stage = document.getElementById('coreStage');
  const rect = stage.getBoundingClientRect();

  orbRenderer = new THREE.WebGLRenderer({ canvas: orbCanvasEl, antialias:true, alpha:true });
  orbRenderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  orbRenderer.setSize(rect.width, rect.height);
  orbRenderer.outputEncoding = THREE.sRGBEncoding;

  orbScene = new THREE.Scene();
  orbCamera = new THREE.PerspectiveCamera(42, rect.width/rect.height, 0.1, 100);
  orbCamera.position.set(0,0,4.4);

  coreGroup = new THREE.Group();
  orbScene.add(coreGroup);

  // -- glass shell: thin fresnel sphere, transparent center, bright glowing edge --
  const geo = new THREE.SphereGeometry(1.32, 48, 48);
  const mat = new THREE.ShaderMaterial({
    uniforms:{ uGlow:{value:0.3} },
    vertexShader: ORB_VERTEX_SHADER,
    fragmentShader: ORB_FRAGMENT_SHADER,
    transparent:true,
    side: THREE.DoubleSide,
    depthWrite:false,
  });
  orbMesh = new THREE.Mesh(geo, mat);
  coreGroup.add(orbMesh);

  // -- inner network: real nodes + connecting lines, matches the reference image structure --
  networkGroup = new THREE.Group();
  orbMesh.add(networkGroup); // child of the glass shell so it rotates together automatically

  function fibonacciSphere(count, radius){
    const pts = [];
    const golden = Math.PI * (3 - Math.sqrt(5));
    for(let i=0;i<count;i++){
      const y = 1 - (i/(count-1))*2;
      const rad = Math.sqrt(Math.max(0,1-y*y));
      const theta = golden * i;
      pts.push(new THREE.Vector3(Math.cos(theta)*rad*radius, y*radius, Math.sin(theta)*rad*radius));
    }
    return pts;
  }
  const NODE_COUNT = 90;
  const nodeRadius = 1.05;
  const nodePts = fibonacciSphere(NODE_COUNT, nodeRadius);

  // connect each node to its nearest few neighbors — proximity graph, matches the ref's triangulated look
  const K = 3;
  const edgeSet = new Set();
  for(let i=0;i<nodePts.length;i++){
    const dists = [];
    for(let j=0;j<nodePts.length;j++){
      if(i===j) continue;
      dists.push([nodePts[i].distanceTo(nodePts[j]), j]);
    }
    dists.sort((a,b)=>a[0]-b[0]);
    for(let k=0;k<K;k++){
      const j = dists[k][1];
      edgeSet.add(i<j ? i+'_'+j : j+'_'+i);
    }
  }
  const edgePositions = [];
  edgeSet.forEach(key=>{
    const [a,b] = key.split('_').map(Number);
    edgePositions.push(nodePts[a].x, nodePts[a].y, nodePts[a].z, nodePts[b].x, nodePts[b].y, nodePts[b].z);
  });
  const edgeGeo = new THREE.BufferGeometry();
  edgeGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(edgePositions), 3));
  const edgeMat = new THREE.LineBasicMaterial({ color:0x4fe3ff, transparent:true, opacity:0.45, blending:THREE.AdditiveBlending, depthWrite:false });
  networkEdges = new THREE.LineSegments(edgeGeo, edgeMat);
  networkGroup.add(networkEdges);

  const nodePositions = new Float32Array(nodePts.length*3);
  nodePts.forEach((p,i)=>{ nodePositions[i*3]=p.x; nodePositions[i*3+1]=p.y; nodePositions[i*3+2]=p.z; });
  const nodeGeo = new THREE.BufferGeometry();
  nodeGeo.setAttribute('position', new THREE.BufferAttribute(nodePositions,3));
  const nodeMat = new THREE.PointsMaterial({
    color:0x9ff1ff, size:0.055, map:makeGlowTexture(), transparent:true,
    blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true
  });
  networkNodes = new THREE.Points(nodeGeo, nodeMat);
  networkGroup.add(networkNodes);


  // -- expanding voice-pulse waves (pool, reused) --
  waveMeshes = [];
  for(let i=0;i<4;i++){
    const g = new THREE.RingGeometry(1.0, 1.05, 64);
    const m = new THREE.MeshBasicMaterial({ color:0x8fe8ff, transparent:true, opacity:0, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending });
    const mesh = new THREE.Mesh(g,m);
    mesh.rotation.x = Math.PI/2;
    mesh.userData = { active:false, scale:1, opacity:0 };
    coreGroup.add(mesh);
    waveMeshes.push(mesh);
  }

  // -- arcs jumping between the two rings --
  arcLines = [];
  for(let i=0;i<3;i++){
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(30*3),3));
    const mat = new THREE.LineBasicMaterial({ color:0xcdf3ff, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false });
    const line = new THREE.Line(geo,mat);
    line.userData = { active:false, born:0, life:1 };
    coreGroup.add(line);
    arcLines.push(line);
  }

  // -- speaking waveform ribbon: small bars ringing the orb, active only while speaking --
  waveformBars = [];
  const WF_COUNT = 40;
  const wfGeo = new THREE.PlaneGeometry(0.035, 0.16);
  for(let i=0;i<WF_COUNT;i++){
    const m = new THREE.MeshBasicMaterial({ color:0xbdeeff, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
    const bar = new THREE.Mesh(wfGeo, m);
    const ang = (i/WF_COUNT)*Math.PI*2;
    bar.userData = { angle:ang, radius:1.28 };
    bar.position.set(Math.cos(ang)*1.28, Math.sin(ang)*1.28, 0.05);
    bar.rotation.z = ang + Math.PI/2;
    coreGroup.add(bar);
    waveformBars.push(bar);
  }

  // -- glow bloom sprites (cheap, reliable bloom without postprocessing deps) --
  const glowTex = makeGlowTexture();
  function makeGlow(scale, opacity){
    const m = new THREE.SpriteMaterial({ map:glowTex, transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false });
    const s = new THREE.Sprite(m);
    s.scale.set(scale,scale,1);
    s.position.z = -0.3;
    return s;
  }
  glowSprite1 = makeGlow(3.2, 0.55);
  glowSprite2 = makeGlow(5.0, 0.28);
  coreGroup.add(glowSprite1, glowSprite2);

  // -- notification ripple: single bright point traveling once around the text ring --
  const rippleMat = new THREE.SpriteMaterial({ map:makeGlowTexture(), transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false });
  rippleSprite = new THREE.Sprite(rippleMat);
  rippleSprite.scale.set(0.28,0.28,1);
  coreGroup.add(rippleSprite);

  // -- particle layers: separate foreground / background depth --
  function makeParticles(count, rMin, rMax, size, color, opacity){
    const positions = new Float32Array(count*3);
    for(let i=0;i<count;i++){
      const r = rMin + Math.random()*(rMax-rMin);
      const theta = Math.random()*Math.PI*2;
      const phi = Math.acos((Math.random()*2)-1);
      positions[i*3]   = r*Math.sin(phi)*Math.cos(theta);
      positions[i*3+1] = r*Math.sin(phi)*Math.sin(theta);
      positions[i*3+2] = r*Math.cos(phi);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions,3));
    const m = new THREE.PointsMaterial({ color, size, transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true });
    return new THREE.Points(g,m);
  }
  bgParticles = makeParticles(70, 2.0, 3.6, 0.045, 0x4fe3ff, 0.55);
  fgParticles = makeParticles(26, 1.1, 2.0, 0.055, 0xffffff, 0.4);
  orbScene.add(bgParticles, fgParticles);

  // -- shifting soft shadow beneath the orb (normal alpha blend, not additive) --
  function makeShadowTexture(){
    const c = document.createElement('canvas'); c.width=c.height=256;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(128,128,0,128,128,128);
    g.addColorStop(0,'rgba(0,4,10,0.55)'); g.addColorStop(1,'rgba(0,4,10,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,256,256);
    return new THREE.CanvasTexture(c);
  }
  const shadowMat = new THREE.SpriteMaterial({ map:makeShadowTexture(), transparent:true, opacity:0.4, depthWrite:false });
  shadowSprite = new THREE.Sprite(shadowMat);
  shadowSprite.scale.set(2.6,1.0,1);
  shadowSprite.position.set(0,-1.55,-0.6);
  orbScene.add(shadowSprite);

  // -- discrete orbiting sparks: individually tracked satellites circling the orb --
  const sparkTex = makeGlowTexture();
  orbitSparks = [];
  const SPARK_COUNT = 7;
  for(let i=0;i<SPARK_COUNT;i++){
    const m = new THREE.SpriteMaterial({ map:sparkTex, transparent:true, opacity:0.85, blending:THREE.AdditiveBlending, depthWrite:false });
    const s = new THREE.Sprite(m);
    const scale = 0.06 + Math.random()*0.05;
    s.scale.set(scale,scale,1);
    orbitSparks.push({
      sprite:s,
      radius: 1.5 + Math.random()*1.3,
      speed: 0.12 + Math.random()*0.22,
      phase: Math.random()*Math.PI*2,
      incline: (Math.random()-0.5)*Math.PI*0.7,
      tilt: Math.random()*Math.PI*2
    });
    orbScene.add(s);
  }

  initDragSparks();
  window.addEventListener('resize', resizeOrbCanvas);
  if(!coreRafId) coreRafId = requestAnimationFrame(orbAnimFrame);
}

function initDragSparks(){
  const stage = document.getElementById('coreStage');
  if(!stage) return;
  isDragging = false;
  lastDragPos = null;
  const onDown = (e)=>{ isDragging = true; lastDragPos = unprojectPointer(e); };
  const onMove = (e)=>{
    if(!isDragging) return;
    const pos = unprojectPointer(e);
    if(lastDragPos && pos.distanceTo(lastDragPos) > 0.02){
      spawnDragBolt(lastDragPos, pos);
      lastDragPos = pos;
    } else if(!lastDragPos){
      lastDragPos = pos;
    }
  };
  const onUp = ()=>{ isDragging = false; lastDragPos = null; };
  stage.addEventListener('pointerdown', onDown);
  stage.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  stage.addEventListener('pointerleave', onUp);
  dragListenerCleanup = ()=>{
    stage.removeEventListener('pointerdown', onDown);
    stage.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    stage.removeEventListener('pointerleave', onUp);
  };
}

function unprojectPointer(e){
  const stage = document.getElementById('coreStage');
  const rect = stage.getBoundingClientRect();
  const ndcX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  const ndcY = -(((e.clientY - rect.top) / rect.height) * 2 - 1);
  const vec = new THREE.Vector3(ndcX, ndcY, 0.5).unproject(orbCamera);
  const dir = vec.sub(orbCamera.position).normalize();
  const dist = -orbCamera.position.z / dir.z;
  return orbCamera.position.clone().add(dir.multiplyScalar(dist));
}

function gen3DBoltPoints(p1, p2, displace){
  let pts = [p1.clone(), p2.clone()];
  function subdivide(points, disp){
    if(disp < 0.008) return points;
    const next = [points[0]];
    for(let i=0;i<points.length-1;i++){
      const a = points[i], b = points[i+1];
      const mid = a.clone().lerp(b, 0.5);
      const dir = b.clone().sub(a).normalize();
      let perp = new THREE.Vector3(0,1,0).cross(dir);
      if(perp.lengthSq() < 0.0001) perp = new THREE.Vector3(1,0,0).cross(dir);
      perp.normalize();
      mid.add(perp.multiplyScalar((Math.random()-0.5)*disp));
      next.push(mid, b);
    }
    return subdivide(next, disp*0.55);
  }
  return subdivide(pts, displace);
}

function spawnDragBolt(p1, p2){
  if(!orbCamera || !orbScene) return;
  const dist = p1.distanceTo(p2);
  const pts = gen3DBoltPoints(p1, p2, Math.max(0.06, dist*0.6));
  const positions = new Float32Array(pts.length*3);
  pts.forEach((p,i)=>{ positions[i*3]=p.x; positions[i*3+1]=p.y; positions[i*3+2]=p.z; });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  const mat = new THREE.LineBasicMaterial({ color:0xdff6ff, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending, depthWrite:false });
  const line = new THREE.Line(geo, mat);
  orbScene.add(line);
  dragSparks.push({ sprite:line, born:performance.now(), life:260+Math.random()*160, isLine:true });
  if(dragSparks.length > 70){
    const old = dragSparks.shift();
    orbScene.remove(old.sprite);
    old.sprite.material.dispose();
    old.sprite.geometry.dispose();
  }
}

function resizeOrbCanvas(){
  const stage = document.getElementById('coreStage');
  if(!stage || !orbRenderer || !orbCamera) return;
  const rect = stage.getBoundingClientRect();
  if(rect.width<=0||rect.height<=0) return;
  orbRenderer.setSize(rect.width, rect.height);
  orbCamera.aspect = rect.width/rect.height;
  orbCamera.updateProjectionMatrix();
}

function disposeOrb3D(){
  if(orbRenderer){ orbRenderer.dispose(); orbRenderer=null; }
  orbScene=null; orbCamera=null; coreGroup=null; orbMesh=null;
  networkGroup=null; networkNodes=null; networkEdges=null;
  bgParticles=null; fgParticles=null; glowSprite1=null; glowSprite2=null;
  shadowSprite=null; orbitSparks=[]; waveMeshes=[]; arcLines=[]; waveformBars=[]; rippleSprite=null;
  smoothedActivity=0.15; smoothedVolume=0; lastVolume=0;
  orbCanvasEl=null;
  if(dragListenerCleanup){ dragListenerCleanup(); dragListenerCleanup=null; }
  isDragging=false; dragSparks=[]; dragSparkTex=null; lastDragPos=null;
  window.removeEventListener('resize', resizeOrbCanvas);
}

function orbAnimFrame(ts){
  const stage = document.getElementById('coreStage');
  if(!stage || !document.getElementById('orbCanvas')){
    disposeOrb3D();
    coreRafId = null;
    return;
  }
  if(coreT0===null) coreT0 = ts;
  const t = (ts - coreT0) / 1000;
  const dt = Math.min(0.05, (ts - (orbAnimFrame._lastTs||ts))/1000);
  orbAnimFrame._lastTs = ts;

  const volume = currentVolume(t);
  const targetActivity = jarvisState==="idle" ? 0.15 : jarvisState==="thinking" ? 0.65 : 0.4 + volume*0.9;
  // exponential smoothing ~0.4-0.5s time constant — this is what makes state changes fade rather than snap
  const smoothK = 1 - Math.exp(-dt/0.45);
  smoothedActivity += (targetActivity - smoothedActivity) * smoothK;
  smoothedVolume += (volume - smoothedVolume) * (1 - Math.exp(-dt/0.12));
  const activity = smoothedActivity;
  const vol = smoothedVolume;

  const driftX = Math.sin(t*0.13)*0.05 + Math.sin(t*0.071)*0.025;
  const driftY = Math.sin(t*0.097)*0.045 + Math.cos(t*0.053)*0.02;
  const bob = Math.sin(t*0.31)*0.035;
  coreGroup.position.set(driftX, driftY+bob, 0);

  // wake flash: brief scale pop + brighten, decaying over ~0.6s (triggered on mic activation)
  const wakeAge = t - wakeFlashT;
  const wakeBoost = wakeAge>=0 && wakeAge<0.6 ? Math.sin((wakeAge/0.6)*Math.PI) * 0.13 : 0;

  const breathe = 1 + Math.sin(t*0.55)*0.02 + vol*0.06 + wakeBoost;
  coreGroup.scale.setScalar(breathe);

  // orb now genuinely rotates in 3D — bounded, non-repeating multi-axis tilt, speed follows state
  const rotSpeed = 1 + activity*1.8;
  orbMesh.rotation.x = Math.sin(t*0.11*rotSpeed)*0.22 + Math.sin(t*0.037*rotSpeed)*0.09;
  orbMesh.rotation.y = t*0.09*rotSpeed + Math.sin(t*0.031*rotSpeed)*0.15;
  orbMesh.rotation.z = Math.sin(t*0.06*rotSpeed)*0.07;
  orbMesh.material.uniforms.uGlow.value = 0.25 + activity*0.55 + vol*0.35 + wakeBoost*1.5;
  networkNodes.material.opacity = 0.7 + vol*0.3 + wakeBoost;
  networkEdges.material.opacity = 0.35 + vol*0.35 + wakeBoost*0.5;

  // -- 2D HUD overlay glow (rings/arc/text) driven by a CSS var, rotation handled by CSS itself --
  if(stage) stage.style.setProperty('--hud-glow', (0.55 + vol*0.4 + wakeBoost).toFixed(3));

  const glowScale = 1 + vol*0.25 + Math.sin(t*0.7)*0.03 + wakeBoost*0.4;
  glowSprite1.scale.set(3.2*glowScale,3.2*glowScale,1);
  glowSprite2.scale.set(5.0*glowScale,5.0*glowScale,1);
  glowSprite1.material.opacity = 0.45 + vol*0.35 + wakeBoost;

  bgParticles.rotation.y += 0.0006*(1+activity);
  bgParticles.rotation.x += 0.0002;
  fgParticles.rotation.y -= 0.0011*(1+activity*1.3);

  shadowSprite.position.x = Math.sin(t*0.09)*0.3;
  shadowSprite.material.opacity = 0.32 + Math.sin(t*0.4)*0.08;

  // -- orbiting sparks: pull inward while listening, per spec --
  const sparkSpeedMul = 1 + activity*1.6;
  const sparkRadiusTarget = jarvisState==="listening" ? 0.55 : 1.0;
  orbitSparks.forEach(o=>{
    o._rMul = o._rMul===undefined ? 1 : o._rMul;
    o._rMul += (sparkRadiusTarget - o._rMul) * smoothK;
    const r = o.radius * o._rMul;
    const ang = t*o.speed*sparkSpeedMul + o.phase;
    let x = Math.cos(ang)*r, z = Math.sin(ang)*r, y = 0;
    const y2 = y*Math.cos(o.incline) - z*Math.sin(o.incline);
    const z2 = y*Math.sin(o.incline) + z*Math.cos(o.incline);
    o.sprite.position.set(x + coreGroup.position.x, y2 + coreGroup.position.y, z2);
    const depthFade = 0.4 + 0.6*((z2+r)/(r*2 || 1));
    o.sprite.material.opacity = 0.5*depthFade + vol*0.3;
  });

  // -- expanding voice-pulse waves: spawn on rising volume edges --
  if(vol > 0.45 && lastVolume <= 0.45 && (jarvisState==="listening"||jarvisState==="speaking")){
    const slot = waveMeshes.find(w=>!w.userData.active);
    if(slot){ slot.userData.active=true; slot.userData.scale=1; slot.userData.opacity=0.55; }
  }
  lastVolume = vol;
  waveMeshes.forEach(w=>{
    if(!w.userData.active) return;
    w.userData.scale += dt*1.8;
    w.userData.opacity -= dt*0.9;
    w.scale.setScalar(w.userData.scale);
    w.material.opacity = Math.max(0, w.userData.opacity);
    if(w.userData.opacity<=0) w.userData.active=false;
  });

  // -- ripple queue: single pulse traveling around the text ring (notifications) --
  rippleQueue = rippleQueue.filter(r => t - r.start < 1.1);
  if(rippleQueue.length){
    const r = rippleQueue[rippleQueue.length-1];
    const age = t - r.start;
    const progress = Math.min(1, age/1.0);
    const ang = progress * Math.PI*2 - Math.PI/2;
    const radius = 1.62;
    rippleSprite.position.set(Math.cos(ang)*radius, Math.sin(ang)*radius*Math.cos(Math.PI/2.25), Math.sin(ang)*radius*Math.sin(Math.PI/2.25));
    rippleSprite.material.opacity = Math.sin(progress*Math.PI) * 0.9;
  } else {
    rippleSprite.material.opacity = 0;
  }

  // -- occasional arcs jumping between the two rings --
  const arcChance = jarvisState==="thinking" ? 0.035 : jarvisState==="idle" ? 0.004 : 0.012;
  if(Math.random() < arcChance){
    const slot = arcLines.find(a=>!a.userData.active);
    if(slot){
      const a1 = Math.random()*Math.PI*2, a2 = a1 + (Math.random()-0.5)*1.2;
      const p1 = new THREE.Vector3(Math.cos(a1)*1.62, 0, Math.sin(a1)*1.62);
      const p2 = new THREE.Vector3(Math.cos(a2)*1.92, 0, Math.sin(a2)*1.92);
      const pts = [];
      const segs = 8;
      for(let i=0;i<=segs;i++){
        const f=i/segs;
        const p = p1.clone().lerp(p2,f);
        if(i>0 && i<segs){ p.y += (Math.random()-0.5)*0.18; p.x += (Math.random()-0.5)*0.06; }
        pts.push(p.x,p.y,p.z);
      }
      const arr = slot.geometry.attributes.position.array;
      for(let i=0;i<pts.length;i++) arr[i]=pts[i];
      for(let i=pts.length;i<arr.length;i++) arr[i]=pts[pts.length-3+((i-pts.length)%3)];
      slot.geometry.attributes.position.needsUpdate = true;
      slot.userData = { active:true, born:t, life:0.35 };
    }
  }
  arcLines.forEach(a=>{
    if(!a.userData.active) return;
    const age = (t-a.userData.born)/a.userData.life;
    if(age>=1){ a.userData.active=false; a.material.opacity=0; return; }
    a.material.opacity = (1-age)*0.75;
  });

  // -- speaking waveform ribbon --
  const wfVisible = jarvisState==="speaking";
  waveformBars.forEach((bar,i)=>{
    const targetOp = wfVisible ? 0.75 : 0;
    bar.material.opacity += (targetOp - bar.material.opacity) * 0.15;
    if(wfVisible){
      const n = Math.sin(t*6 + i*0.7)*0.5+0.5;
      const amp = 0.4 + n*vol*2.2;
      bar.scale.y = Math.max(0.15, amp);
    }
  });

  const camAngle = Math.sin(t*0.045)*0.03;
  orbCamera.position.x = Math.sin(camAngle)*4.4;
  orbCamera.position.y = Math.sin(t*0.031)*0.06;
  orbCamera.position.z = Math.cos(camAngle)*4.4;
  orbCamera.lookAt(0,0,0);

  const nowMs = performance.now();
  dragSparks = dragSparks.filter(sp=>{
    const age = (nowMs - sp.born) / sp.life;
    if(age >= 1){
      orbScene.remove(sp.sprite);
      sp.sprite.material.dispose();
      if(sp.sprite.geometry) sp.sprite.geometry.dispose();
      return false;
    }
    const fade = Math.pow(1-age, 1.4);
    sp.sprite.material.opacity = fade * 0.9;
    if(!sp.isLine){
      const s = sp.sprite.scale.x * (1 + 0.01);
      sp.sprite.scale.set(s,s,1);
    }
    return true;
  });

  orbRenderer.render(orbScene, orbCamera);
  coreRafId = requestAnimationFrame(orbAnimFrame);
}

function triggerWakeFlash(){
  wakeFlashT = coreT0===null ? 0 : (performance.now()-coreT0)/1000;
}
function triggerRipple(){
  rippleQueue.push({ start: coreT0===null ? 0 : (performance.now()-coreT0)/1000 });
}

function initCoreVisual(){
  setJarvisState(jarvisState);
  init3DOrb();
}

let chatThinking = false;
let captionClearTimer = null;

function buildBusinessContext(){
  const today = todayISO();
  const jobsSummary = DATA.jobs.map(j=>{
    const cust = DATA.customers.find(c=>c.id===j.customerId);

    return "#JOB-"+String(j.id).padStart(3,'0')+" | "+svcMap[j.service].label+" | customer: "+(cust?cust.name:"unknown")
      +" | address: "+(j.address||"n/a")+" | date: "+j.date+" | status: "+STATUS_LABEL[j.status]
      +" | value: $"+j.value+" | crew: "+(crewNames.length?crewNames.join(", "):"UNASSIGNED")
      +(j.blueSeal?" | BLUE SEAL REQUIRED":"")
      +(j.notes?" | notes: "+j.notes:"");
  }).join("\n");
  const custSummary = DATA.customers.map(c=>c.name+" | phone: "+(c.phone||"n/a")+" | email: "+(c.email||"n/a")+" | address: "+(c.address||"n/a")+(c.notes?" | notes: "+c.notes:"")).join("\n");
  const crewSummary = DATA.crew.map(c=>c.name+" ("+c.role+") | "+(c.active?"on duty":"off duty")+(c.blueSeal?" | Blue Seal certified":"")).join("\n");
  const quotesSummary = DATA.quotes.map(q=>{
    const cust = DATA.customers.find(c=>c.id===q.customerId);
    return "Q-"+String(q.id).padStart(3,'0')+" | "+(cust?cust.name:"unknown")+" | $"+q.amount+" | status: "+q.status+(q.desc?" | "+q.desc:"");
  }).join("\n");

  return "Today's date: "+today+"\n\n"
    + "=== JOBS ===\n"+(jobsSummary||"No jobs on record.")+"\n\n"
    + "=== CUSTOMERS ===\n"+(custSummary||"No customers on record.")+"\n\n"
    + "=== CREW ===\n"+(crewSummary||"No crew on record.")+"\n\n"
    + "=== QUOTES & INVOICES ===\n"+(quotesSummary||"No quotes on record.");
}

function buildHud2DSvg(){
  const cx=150, cy=150;
  // tick ring
  let ticks = "";
  const tickCount = 72;
  for(let i=0;i<tickCount;i++){
    const a = (i/tickCount)*Math.PI*2 - Math.PI/2;
    const major = i%6===0;
    const r1 = major ? 100 : 104;
    const r2 = 112;
    const x1 = cx+Math.cos(a)*r1, y1 = cy+Math.sin(a)*r1;
    const x2 = cx+Math.cos(a)*r2, y2 = cy+Math.sin(a)*r2;
    ticks += '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="'+(major?"#bfe9ff":"#4fb4d9")+'" stroke-width="'+(major?1.6:1)+'" opacity="'+(major?0.6:0.3)+'"/>';
  }
  return '<svg class="hud2d" id="hud2d" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">'
    + '<g class="hud2d-bg">'
      + '<circle cx="'+cx+'" cy="'+cy+'" r="145" fill="none" stroke="#4fe3ff" stroke-width="1" opacity="0.08"/>'
      + '<circle cx="'+cx+'" cy="'+cy+'" r="125" fill="none" stroke="#4fe3ff" stroke-width="1" opacity="0.1"/>'
    + '</g>'
    + '<g class="hud2d-ticks">' + ticks + '</g>'
  + '</svg>';
}
